name: Companion and extension checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r companion/requirements.txt pyinstaller==6.19.0
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python -m PyInstaller --noconfirm --onefile --name tab-observatory-host --distpath dist/bin companion/native_host.py
      - if: runner.os == 'Windows'
        run: python scripts/check_binary.py dist/bin/tab-observatory-host.exe
      - if: runner.os != 'Windows'
        run: python scripts/check_binary.py dist/bin/tab-observatory-host
